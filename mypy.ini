# mypy — the type gate for the `@wom` estate root `scripts/` (T509 AC8).
#
# Matches `w0m-web/mypy.ini` (T188) and `w0m-api/mypy.ini` (T189) so all three
# roots share identical checking discipline: gated at zero errors, explicit
# third-party stub exclusions only (no blanket `ignore_missing_imports`), and
# top-level `scripts/*.py` scope (`scripts/tests/` and `scripts/archive/` excluded).

[mypy]
files = scripts
exclude = (?x)( ^scripts/archive/ | ^scripts/tests/ | ^scripts/hooks/ | ^scripts/graphify-out/ | _test\.py$ )
mypy_path = scripts:w0m-web/project/scripts
explicit_package_bases = True

warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
show_error_codes = True
pretty = False

# ── third-party libraries with no stubs, named individually ──
[mypy-requests.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-frontmatter.*]
ignore_missing_imports = True

[mypy-supabase.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-skillopt_sleep.*]
ignore_missing_imports = True
