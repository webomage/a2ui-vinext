    path. ✅ **OWNER DECISION 2026-08-07: keep `readOnlyMode: false` on BOTH.** Write
    access is the point — the intended use is manual and Obsidian-tool analysis written
    back to `.md` through MCP. This is a deliberate, reasoned acceptance, not an unreviewed
    default. ⚠️ What that means in practice, and it is on the agent doing the writing:
    an MCP `edit` in the **wom7web** vault touches the code repo **outside** the Edit/git
    path, so it produces no diff you read first and can leave the working tree dirty
    without anything announcing it. 🔴 T186 (2026-08-08): this used to say *''prefer
    the wom7md vault for notes''* — **there is no second vault any more**, so that
    escape hatch is gone and every MCP write lands in a live code repo. `git status`
    afterwards is now the only check. Ties [[T144]]. Port 3007 → the **wom7web** vault,
    which is also the code repo.'
  system: system:default/w0m
relations:
- type: ownedBy
  targetRef: group:default/platform
- type: partOf
  targetRef: system:default/w0m
