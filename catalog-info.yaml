apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mcp-obsidian-w0m-web
  namespace: default
  title: 'MCP Server: obsidian-w0m-web'
  description: 'Obsidian vault access over MCP, served by the **`semantic-vault-mcp`**
    plugin ("Semantic Notes Vault MCP" 0.11.42, Aaron Bockelie) running inside an
    Obsidian renderer process — NOT a standalone daemon, so it exists only while that
    vault window is open. 🔴 CORRECTED 2026-08-07: this entry previously attributed
    both ports to `obsidian-local-rest-api` v5.0.2. That was wrong, and the estate
    contradicted itself about it — `project/mcp-exposure-baseline.json` had already
    named the right plugin. Proven by elimination, not by reading a name off the thing:
    BOTH vaults'' local-rest-api `apiKey`s are rejected 401 by BOTH ports, while `<vault>/.obsidian/plugins/semantic-vault-mcp/data.json`
    records `httpPort` matching exactly. ✅ port↔vault mapping RESOLVED 2026-08-07
    (was recorded unknown): the plugin config carries the port, so it was readable
    all along — the earlier probe looked in the local-rest-api config, which only
    ever records 27123/27124. ✅ REACHABLE from a Claude session since 2026-08-07 via
    the stdio bridge `scripts/obsidian_mcp_bridge.py`, wired in the estate-root `.mcp.json`.
    The bridge exists because the server needs `Authorization: Bearer <apiKey>` and
    CLAUDE.md forbids secrets in files: it reads the key at launch from the plugin''s
    own gitignored `data.json`, so the credential is never copied into any config.
    It also reads the PORT from there rather than taking one on the command line —
    the two vaults have collided on ports before, and a hardcoded port would silently
    talk to the wrong vault. ⚠️ Session-ful transport: everything after `initialize`
    400s unless the returned `Mcp-Session-Id` is echoed, and the server returns that
    header LOWER-CASED. 🔴 Exposes 8 tools incl. **`edit`**, and `readOnlyMode` is
    **false** in both vaults — an agent with these tools can WRITE to the vault. For
    `wom7web` that vault is a live code repo, so writes land outside the normal Edit/git
    path. ✅ **OWNER DECISION 2026-08-07: keep `readOnlyMode: false` on BOTH.** Write
    access is the point — the intended use is manual and Obsidian-tool analysis written
    back to `.md` through MCP. This is a deliberate, reasoned acceptance, not an unreviewed
    default. ⚠️ What that means in practice, and it is on the agent doing the writing:
    an MCP `edit` in the **wom7web** vault touches the code repo **outside** the Edit/git
    path, so it produces no diff you read first and can leave the working tree dirty
    without anything announcing it. 🔴 T186 (2026-08-08): this used to say *''prefer
    the wom7md vault for notes''* — **there is no second vault any more**, so that
    escape hatch is gone and every MCP write lands in a live code repo. `git status`
    afterwards is now the only check. Ties [[T144]]. Port 3007 → the **wom7web** vault,
    which is also the code repo.'
  annotations:
    w0m.dev/mcp-auth: required — per-vault semantic-vault-mcp apiKey; unauthenticated
      probe returns 401
    w0m.dev/mcp-bind: 127.0.0.1:3007
    w0m.dev/mcp-required: 'false'
    w0m.dev/mcp-scope: host
    w0m.dev/mcp-transport: local-http
    w0m.dev/source-register: .w0m/sdlc.json
  tags:
  - mcp
  - mcp-server
  - local-http
  - host
spec:
  type: mcp-server
  lifecycle: production
  owner: group:default/platform
  definition: 'Obsidian vault access over MCP, served by the **`semantic-vault-mcp`**
