# Hooks for the ESTATE WORKSPACE repo (T294 AC3).
#
# Deliberately SHORT. This repo holds estate-root config, editor workspaces and cross-repo reports —
# no application code — so oxlint/mypy/deno/osv would have nothing to inspect, and a gate that never
# looks at anything is worse than no gate: it reports green and teaches people the check exists.
#
# 🔴 The reason a hook stack is required here at all: this repo's FIRST commit ran through nothing,
# because `.git/hooks` did not exist yet. That commit was secrets-scanned by hand, and the scan found
# a real Supabase service key quoted in AUDIT-2026-06-13.md. Nothing but the manual scan stood
# between that value and this repo's permanent history.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # AC2's guarantee, enforced rather than asserted. The estate is a workspace of seven
      # INDEPENDENT repos; sweeping one into this eighth is the failure the .gitignore prevents and
      # this hook catches if that file is ever loosened. A one-time `git add -A` proof expires the
      # moment someone edits an ignore rule.
      - id: no-nested-repos
        name: refuse to commit any file from a nested repo
        entry: python3 scripts/no_nested_repos.py
        language: system
        pass_filenames: true
        always_run: false

      - id: conventional-commit
        name: Conventional Commits
        entry: python3 scripts/conventional_commit.py
        language: system
        stages: [commit-msg]
        always_run: true

      - id: emoji-check
        name: emoji policy check
        entry: python3 scripts/emoji_policy_check.py --staged
        language: system
        pass_filenames: false
        always_run: true

      # T430 — moved from wom7web: `.tasks/`, TASKS.md and scripts/tasks_query.py live HERE since
      # T411/T419, so wom7web's copy of this hook could never fire and the derived `x_*` fields drifted
      # (46 tickets, measured 2026-09-23). Stages ONLY what it rewrote (`--porcelain` + `xargs -r`),
      # never other tickets a person left unstaged. The filter mirrors the generator's inputs in THIS
      # repo; the script itself still lives in wom7web.
      - id: tickets-frontmatter
        name: Refresh ticket frontmatter (derived x_* fields)
        entry: sh -c 'python3 wom7web/project/scripts/tickets_frontmatter_sync.py --porcelain | xargs -r git add'
        language: system
        files: ^(\.tasks/T\d+\.md|TASKS\.md|scripts/tasks_query\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # T335 follow-up. `docs/DECISIONS.md` lives in wom7web but is GENERATED from files that live HERE (.tasks/,
      # .w0m/sdlc.json, TECH-DEBT.md, ROADMAP.md, the confirm policy). wom7web's own hook cannot see a commit in this
      # repo (T430), so adding 6 lines to sdlc.json shifted every later `file:line` anchor, went in green, and failed the
      # next deploy on `decisions-index-fresh`. CHECK-ONLY on purpose: the index belongs to another repo, so this hook
      # cannot stage it, and silently rewriting a file in a sibling checkout from a commit hook is worse than saying so.
      # 🔴 The `files:` filter MIRRORS the ESTATE-based entries of decisions_index.py SOURCES, and
      # wom7web's test_decisions_index.py asserts it still does.
      - id: decisions-index-fresh
        name: decisions index (wom7web/docs/DECISIONS.md) is current
        entry: python3 wom7web/project/scripts/decisions_index.py --check
        language: system
        files: ^(\.tasks/T\d+\.md|\.w0m/sdlc\.json|TECH-DEBT\.md|ROADMAP\.md|project/policies/confirm-policy\.json)$
        pass_filenames: false
        stages: [pre-commit]

      - id: changelog-check
        name: Public disclosure guardrail check on CHANGELOG.md
        entry: python3 scripts/changelog_check.py --path CHANGELOG.md
        language: system
        files: ^CHANGELOG\.md$
        pass_filenames: false
        stages: [pre-commit]
